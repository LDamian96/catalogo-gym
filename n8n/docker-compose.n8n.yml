version: '3.8'

services:
  # ==========================================
  # n8n - Workflow Automation
  # ==========================================
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: cat_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # General
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - NODE_ENV=production
      # Webhook URL (importante para triggers externos)
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      # Timezone
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/Lima}
      - TZ=${TZ:-America/Lima}
      # Seguridad
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-changeme}
      # Ejecuciones - guardar datos para debug
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_ON_PROGRESS=true
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true
      # Limpieza de ejecuciones antiguas
      - EXECUTIONS_DATA_MAX_AGE=168
      - EXECUTIONS_DATA_PRUNE=true
      # Community nodes
      - N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE=true
    volumes:
      - cat_n8n_data:/home/node/.n8n
    networks:
      - cat_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  cat_n8n_data:
    driver: local

networks:
  cat_network:
    external: true
    name: cat_network
