# ============================================================
# Nginx Configuration with SSL/TLS (Let's Encrypt)
# ============================================================
#
# OBTENER CERTIFICADOS CON CERTBOT:
# 1. Instalar certbot en el host:
#      sudo apt install certbot
#
# 2. Detener nginx temporalmente (o usar webroot):
#      docker compose -f docker-compose.prod.yml stop nginx
#
# 3. Obtener certificado:
#      sudo certbot certonly --standalone -d tu-dominio.com -d www.tu-dominio.com
#
# 4. Los certificados se guardan en /etc/letsencrypt/live/tu-dominio.com/
#
# 5. Reemplazar _DOMAIN_ en este archivo con tu dominio real:
#      sed -i 's/_DOMAIN_/tu-dominio.com/g' docker/nginx.conf
#
# 6. Reiniciar nginx:
#      docker compose -f docker-compose.prod.yml up -d nginx
#
# 7. Renovacion automatica (agregar al crontab del host):
#      0 3 * * * certbot renew --quiet && docker exec cat_nginx nginx -s reload
# ============================================================

upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:4000;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

# ============================================================
# HTTP -> HTTPS redirect
# ============================================================
server {
    listen 80;
    server_name _DOMAIN_;

    # Let's Encrypt ACME challenge (needed for cert renewal via webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# HTTPS server
# ============================================================
server {
    listen 443 ssl http2;
    server_name _DOMAIN_;

    # ----------------------------
    # SSL Certificate (Let's Encrypt)
    # ----------------------------
    ssl_certificate /etc/letsencrypt/live/_DOMAIN_/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/_DOMAIN_/privkey.pem;

    # ----------------------------
    # SSL Best Practices
    # ----------------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL session caching
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/_DOMAIN_/chain.pem;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ----------------------------
    # Security Headers
    # ----------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ----------------------------
    # Gzip Compression
    # ----------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Max upload size
    client_max_body_size 10M;

    # ----------------------------
    # Backend API
    # ----------------------------
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ----------------------------
    # Frontend Next.js
    # ----------------------------
    location / {
        limit_req zone=general burst=50 nodelay;

        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ----------------------------
    # Static Assets Caching
    # ----------------------------
    location /_next/static/ {
        proxy_pass http://frontend;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ----------------------------
    # Image Optimization Caching
    # ----------------------------
    location /_next/image {
        proxy_pass http://frontend;
        proxy_cache_valid 200 60d;
        add_header Cache-Control "public, max-age=5184000";
    }
}
